name: Release

# Tag push v<version> -> published release (marked latest).
# Manual run -> draft release v<version> from the selected branch.
# Asset names are stable so releases/latest/download/<name> links keep working.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Toolchain verified locally for this workspace (no rust-toolchain file).
  RUST_TOOLCHAIN: "1.97.0"
  NODE_VERSION: "22"
  CARGO_TERM_COLOR: always

# Release builds deliberately run without dependency/build caches so a
# poisoned cache cannot reach published binaries.
jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      draft: ${{ steps.version.outputs.draft }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify tag and manifest versions
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ $EVENT_NAME == push ]]; then
            tag=$REF_NAME
            version=$(bash scripts/package-release-assets.sh check-version "$tag")
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $tag points to $GITHUB_SHA, which is not on origin/main."
              exit 1
            fi
            draft=false
          else
            if [[ $REF_NAME != main ]]; then
              echo "::error::Manual draft releases are built from main only (got $REF_NAME)."
              exit 1
            fi
            version=$(bash scripts/package-release-assets.sh check-version)
            tag="v$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
              && [[ $(git rev-parse "refs/tags/$tag^{commit}") != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag already points to another commit; a draft would ship different binaries."
              exit 1
            fi
            draft=true
          fi
          prerelease=false
          if [[ $version == *-* ]]; then prerelease=true; fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "draft=$draft"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"
          echo "Release $tag (version $version, draft=$draft, prerelease=$prerelease)"

  linux:
    name: Build Ubuntu packages
    needs: prepare
    # Oldest supported Ubuntu: binaries built here need glibc <= 2.35.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri build prerequisites
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # man-db triggers can stall package installs on hosted runners.
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            build-essential pkg-config file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Restore locked dependencies
        run: |
          npm ci
          cargo fetch --locked

      # The build scripts run Cargo offline against the fetched lockfile.
      - name: Build server package
        run: bash scripts/build-linux.sh

      - name: Build desktop package
        run: bash scripts/build-linux-desktop.sh

      - name: Package release assets
        run: bash scripts/package-release-assets.sh linux target/release-assets

      - name: Check bundled installer
        run: |
          set -euo pipefail
          check_dir="$RUNNER_TEMP/bundle-check"
          mkdir -p "$check_dir"
          tar -xzf target/release-assets/HomeProxy-Ubuntu-amd64.tar.gz -C "$check_dir"
          bash scripts/test-linux-install-bundle.sh "$check_dir/HomeProxy-Ubuntu-amd64"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-assets
          path: target/release-assets/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows installer
    needs: prepare
    runs-on: windows-latest
    # The optional signing secret lives in this environment; protect it with
    # required reviewers and a v*/main ref rule in the repository settings.
    environment: release
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # Keep LF endings so Git Bash can run the shell scripts unchanged.
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Restore locked dependencies
        run: |
          npm ci
          cargo fetch --locked

      # Optional Authenticode signing: only when the owner has stored an
      # authorized Tauri signing config (JSON) in this secret. Without it the
      # installer is built unsigned and verified as NotSigned.
      - name: Prepare optional signing config
        id: signing
        env:
          SIGNING_CONFIG: ${{ secrets.HOMEPROXY_TAURI_SIGNING_CONFIG }}
        run: |
          set -euo pipefail
          if [[ -n ${SIGNING_CONFIG:-} ]]; then
            config="$RUNNER_TEMP/tauri-signing.json"
            printf '%s' "$SIGNING_CONFIG" >"$config"
            echo "config=$config" >>"$GITHUB_OUTPUT"
            echo "signed=true" >>"$GITHUB_OUTPUT"
          else
            echo "signed=false" >>"$GITHUB_OUTPUT"
            echo "No signing config secret; building an unsigned installer."
          fi

      - name: Build NSIS installer
        env:
          SIGNING_CONFIG_PATH: ${{ steps.signing.outputs.config }}
        run: |
          set -euo pipefail
          args=(build --ci --bundles nsis)
          if [[ -n ${SIGNING_CONFIG_PATH:-} ]]; then args+=(--config "$SIGNING_CONFIG_PATH"); fi
          npm run tauri -- "${args[@]}" -- --locked

      - name: Remove signing config
        if: always()
        env:
          SIGNING_CONFIG_PATH: ${{ steps.signing.outputs.config }}
        run: rm -f -- "${SIGNING_CONFIG_PATH:-/nonexistent}"

      - name: Verify installer identity and signature state
        shell: pwsh
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          $ErrorActionPreference = "Stop"
          $app = (Resolve-Path -LiteralPath "target/release/klidna-sit.exe").Path
          $installer = (Resolve-Path -LiteralPath "target/release/bundle/nsis/HomeProxy_$($env:VERSION)_x64-setup.exe").Path
          $policy = (Resolve-Path -LiteralPath "scripts/windows-signing-policy.json").Path
          $extract = Join-Path $env:RUNNER_TEMP "nsis-payload"
          & 7z x -y "-o$extract" -- $installer | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip could not extract $installer" }
          $embedded = @(Get-ChildItem -LiteralPath $extract -Recurse -File -Filter klidna-sit.exe)
          if ($embedded.Count -ne 1) { throw "Expected exactly one embedded klidna-sit.exe, found $($embedded.Count)" }
          if ($env:SIGNED -eq "true") {
            foreach ($candidate in @($app, $embedded[0].FullName)) {
              ./scripts/verify-windows-release.ps1 -ExpectedVersion $env:VERSION -AppPath $candidate `
                -InstallerPath $installer -PolicyPath $policy
            }
          } else {
            ./scripts/verify-windows-unsigned-release.ps1 -ExpectedVersion $env:VERSION -AppPath $app `
              -InstallerPath $installer -EmbeddedAppPath $embedded[0].FullName
          }

      - name: Package release assets
        run: bash scripts/package-release-assets.sh windows "target/release/bundle/nsis/HomeProxy_${VERSION}_x64-setup.exe" target/release-assets

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-assets
          path: target/release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [prepare, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # create the release and upload assets
      id-token: write # OIDC token for build provenance signing
      attestations: write # store the provenance attestation
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      DRAFT: ${{ needs.prepare.outputs.draft }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-assets"
          path: release-assets
          merge-multiple: true

      - name: Verify assets and write checksums and notes
        run: bash scripts/package-release-assets.sh finalize release-assets "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"

      # Attestations are free for public repositories only.
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          title="HomeProxy $VERSION"
          mapfile -t existing < <(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | "\(.id) \(.draft)"')
          if ((${#existing[@]} > 1)); then
            echo "::error::More than one release uses tag $RELEASE_TAG; clean up the duplicates manually."
            exit 1
          elif ((${#existing[@]} == 1)); then
            if [[ ${existing[0]#* } != true ]]; then
              echo "::error::Release $RELEASE_TAG is already published; bump the version instead of replacing its assets."
              exit 1
            fi
            gh api -X PATCH "repos/$GH_REPO/releases/${existing[0]%% *}" \
              -f name="$title" -F body=@"$notes" -f target_commitish="$GITHUB_SHA" >/dev/null
          else
            create_args=(--draft --title "$title" --notes-file "$notes" --target "$GITHUB_SHA")
            if [[ $PRERELEASE == true ]]; then create_args+=(--prerelease); fi
            if [[ $EVENT_NAME == push ]]; then create_args+=(--verify-tag); fi
            gh release create "$RELEASE_TAG" "${create_args[@]}"
          fi
          # A reused draft must end with exactly this run's asset set.
          mapfile -t stale < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for name in "${stale[@]}"; do
            [[ -f "release-assets/$name" ]] || gh release delete-asset "$RELEASE_TAG" "$name" --yes
          done
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [[ $DRAFT == true ]]; then
            echo "Draft release $RELEASE_TAG is ready for review."
          elif [[ $PRERELEASE == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
