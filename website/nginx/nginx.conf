worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  charset utf-8;
  charset_types text/css text/plain text/xml application/javascript application/json image/svg+xml;
  client_max_body_size 1k;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml image/x-icon;

  # Only the production host may be indexed; previews and unknown hosts are noindex.
  map $host $robots_policy {
    default "noindex, nofollow";
    homeproxy.thetasigma.io "index, follow";
  }

  # Hashed assets are immutable; HTML revalidates; redirects and probes are never stored.
  map $uri $resource_cache {
    default "public, max-age=0, must-revalidate";
    "~^/assets/[^/]+\.[0-9a-f]{12}\.(css|js|woff2|avif|webp|png|svg)$" "public, max-age=31536000, immutable";
    / "no-store";
    /healthz "no-store";
    /version.json "no-store";
  }
  map $status $response_cache {
    default "no-store";
    200 $resource_cache;
    304 $resource_cache;
  }

  # "/" language choice: explicit cookie first, then the first cs/sk/en tag in
  # Accept-Language (cs and sk get Czech), otherwise English.
  map $cookie_lang $lang_cookie {
    default "";
    cs cs;
    en en;
  }
  map $http_accept_language $lang_header_tag {
    default en;
    "~*^(?:[^,]*,)*?\s*(?<first_tag>cs|sk|en)(?:[-_;,\s]|$)" $first_tag;
  }
  map $lang_header_tag $lang_header {
    default en;
    ~*^(?:cs|sk)$ cs;
  }
  map $lang_cookie $lang_target {
    "" $lang_header;
    default $lang_cookie;
  }

  server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    error_page 404 /404.html;

    include /etc/nginx/security-headers.conf;

    # Canonical directory URLs; matched on the client URI so the internal
    # index lookup never loops.
    if ($request_uri ~ "^(?<dir>(?:/[a-z0-9-]+)*/)index\.html(?:\?|$)") {
      return 301 $dir;
    }

    location = /healthz {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    location = / {
      include /etc/nginx/security-headers.conf;
      add_header Vary "Accept-Language, Cookie" always;
      return 302 /$lang_target/;
    }

    location ~ ^/(cs|en)$ {
      return 301 /$1/;
    }

    location = /404.html {
      internal;
    }

    location ~ \.gz$ {
      return 404;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
